# Builds TSS-1 on macOS, Windows and Linux - only when asked:
# - a commit on main whose message contains [build]: builds + installers, downloadable under the run's "Artifacts"
# - a commit on main whose message contains [release], a pushed tag vX.Y.Z, or "Run workflow" on the Actions page:
#   also publishes a GitHub Release with all installers, the manual and the update history attached
# Ordinary commits do not build anything.
name: Build TSS-1

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
            configure: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          - name: Windows
            os: windows-2022
            configure: ""
          - name: Linux
            os: ubuntu-22.04
            configure: -DCMAKE_BUILD_TYPE=Release -DTSS_BUILD_TESTS=ON
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Read version
        run: echo "VERSION=$(sed -nE 's/^project\(TSS1 VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DTSS_COPY_PLUGINS=OFF ${{ matrix.configure }}

      - name: Build
        run: |
          set +e
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "## Build errors (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|fatal|undefined reference|unresolved" build.log | grep -v "warning" | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE " error |error:|fatal error|unresolved external" build.log | head -10 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $status

      # ---- tests / validation ------------------------------------------------------------
      - name: Run plug-in tests (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p test-out
          xvfb-run -a build/TSS1Test_artefacts/Release/TSS1Test test-out

      - name: Upload test output (Linux)
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-TSS-1-${{ env.VERSION }}
          path: test-out/*
          if-no-files-found: ignore

      - name: Check minimum macOS version (must run on macOS 12 Monterey and older)
        if: runner.os == 'macOS'
        run: |
          for b in "build/TSS1_artefacts/Release/AU/TSS-1.component/Contents/MacOS/TSS-1" "build/TSS1_artefacts/Release/VST3/TSS-1.vst3/Contents/MacOS/TSS-1" "build/TSS1_artefacts/Release/Standalone/TSS-1.app/Contents/MacOS/TSS-1"; do
            for a in arm64 x86_64; do
              m=$(vtool -arch $a -show-build "$b" | awk '/minos/{print $2}')
              echo "$b ($a): minos $m"
              [ "$(printf '%s\n' "$m" 11.0 | sort -V | head -1)" = "$m" ] || { echo "::error::$b needs macOS $m - too new"; exit 1; }
            done
          done

      - name: Validate Audio Unit (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/TSS1_artefacts/Release/AU/TSS-1.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Tss1 Trlb

      # ---- packaging ---------------------------------------------------------------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x tools/make_pkg.sh
          ./tools/make_pkg.sh
          mv "dist/TSS-1-$VERSION.pkg" "dist/TSS-1-$VERSION-macOS.pkg"
          cd build/TSS1_artefacts/Release
          ditto -c -k --keepParent "AU/TSS-1.component" "$GITHUB_WORKSPACE/dist/TSS-1-$VERSION-macOS-AU.zip"
          ditto -c -k --keepParent "VST3/TSS-1.vst3" "$GITHUB_WORKSPACE/dist/TSS-1-$VERSION-macOS-VST3.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "installer\windows\TSS-1.iss" 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            "## Inno Setup errors" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content iscc.log -Tail 30 | ForEach-Object { "::error::$_" }
            exit $LASTEXITCODE
          }
          Compress-Archive -Path "build\TSS1_artefacts\Release\VST3\TSS-1.vst3" `
                           -DestinationPath "dist\TSS-1-$env:VERSION-Windows-VST3.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/package_linux.sh
          ./tools/package_linux.sh

      - name: Add the manual and the update history
        run: cp "docs/TSS-1 Manual.pdf" "docs/TSS-1 Update History.pdf" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: TSS-1-${{ env.VERSION }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        run: echo "VERSION=$(sed -nE 's/^project\(TSS1 VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: TSS-1-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: v${{ env.VERSION }}
          name: TSS-1 ${{ env.VERSION }}
          body: "TSS-1 ${{ env.VERSION }} - Transistor Speech System. See TSS-1 Update History.pdf. macOS: the .pkg installer (or the AU/VST3 zips); Windows: the Setup.exe (or the VST3 zip); Linux: the .tar.gz. The manual is attached."
          generate_release_notes: false
